# Z-date scenarios (Pramana_Ledger_Spec.md §5.4, §6).
#
# Z is the date a cryptographically relevant quantum computer is assumed
# available. It is an ASSUMPTION the operator picks, never a prediction this
# tool makes -- which is why there are three of them, every row says which one
# it used, and the UI switches between them live. There is no probabilistic Z
# (§5.12 rejects it): a probability distribution over Z would let a weighted
# score creep back in through the side door.
#
# Same citation rule as data/base_confidence.yaml.
schema_version: 1

scenarios:
  - id: Z_aggressive
    label: Aggressive
    z_date: 2031-01-01
    usable: true
    citation: "docs/architecture/Pramana_Ledger_Spec.md §6"
    quote: "Z_aggr 2031-01-01, Z_central 2036-01-01, Z_optim 2041-01-01 (test constants)"
    basis: TEST_CONSTANT
    verify: >-
      STILL OPEN (§9 item 2), narrowed 2026-09-23: the GRI 2025 report
      (docs/sources/GRI_Quantum_Threat_Timeline_2025.md) states 10- and 15-year
      figures on its publication page but no 5-year figure for this edition,
      so this date keeps only its test-constant basis. Not filled in from the
      "5-14%" secondary sources attribute to the 2024 survey.

  - id: Z_central
    label: Central
    z_date: 2036-01-01
    usable: true
    citation: "docs/sources/GRI_Quantum_Threat_Timeline_2025.md -- 10-year horizon from 9 Mar 2026"
    quote: "quite possible (28-49%)"
    basis: EXPERT_SURVEY
    test_constant_citation: "docs/architecture/Pramana_Ledger_Spec.md §6 -- Z_central 2036-01-01"
    verify: >-
      RESOLVED 2026-09-23 (§9 item 2): GRI Quantum Threat Timeline Report 2025
      puts a CRQC at "quite possible (28-49%)" within 10 years of its 9 March
      2026 publication; 2036-01-01 is that horizon. Still an assumption the
      operator picks (§5.12: no probabilistic Z), now with a stated basis.
    default: true

  - id: Z_optimistic
    label: Optimistic
    z_date: 2041-01-01
    usable: true
    citation: "docs/sources/GRI_Quantum_Threat_Timeline_2025.md -- 15-year horizon from 9 Mar 2026"
    quote: "likely (51-70%)"
    basis: EXPERT_SURVEY
    test_constant_citation: "docs/architecture/Pramana_Ledger_Spec.md §6 -- Z_optim 2041-01-01"
    verify: >-
      RESOLVED 2026-09-23 (§9 item 2): the same report puts a CRQC at "likely
      (51-70%)" within 15 years. Optimistic here means "the quantum computer
      comes late", i.e. the date by which experts already call it likely.

# Default rollout window Y: the time a signature-key rotation takes to reach
# every relying party (§5.6, deadline Z - Y).
policy_defaults:
  - key: rollout_Y_days
    value: 365
    usable: false
    status: NOT_STATED_IN_REPO
    citation: "docs/architecture/Pramana_Ledger_Spec.md §5.4 -- names rollout_Y_default, gives no number"
    why_not_usable: >-
      The spec makes Y a policy input and never states a default. A number
      picked here would silently move every ROTATE_BEFORE_Z deadline, so
      Policy requires rollout_Y_days explicitly and has no fallback.
