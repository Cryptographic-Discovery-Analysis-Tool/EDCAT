# Regulatory / programme migration deadlines (build-plan.md P22).
#
# These are NOT Z. Z (data/scenarios.yaml) is when a quantum computer is
# assumed to arrive; a policy deadline is when an authority says migration
# must be done, whether or not Z has arrived. The ledger's bands never read
# this file -- `risk/policy.py` lays these dates over a row as an annotation
# ("open / met / undetermined against India CII full migration, 2029-12-31"),
# so a band cannot move because a regulator published a date.
#
# Same citation rule as every other registry: usable rows cite a non-empty
# in-repo file (docs/sources/, vendored excerpts with the fetched PDF's
# SHA-256) and quote the sentence that states the date.
schema_version: 1

policies:
  - key: IN_DST_CII
    label: "India DST roadmap -- Critical Information Infrastructure"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/India_DST_Quantum_Safe_Roadmap_2026.md -- printed pp. 105-107"
    quote: "Milestone 3: Full Migration – (CII : 31 December 2029, Enterprises: No later than 31 December 2033)"
    milestones:
      - key: foundations
        label: "Building the foundations (inventory, CBOM requests)"
        # Programme-level: inventory, CBOM requests, pilots. Not something a
        # single key meets or misses, so risk/policy.py never lays it on a row.
        scope: programme
        date: 2027-12-31
        quote: "Milestone 1: Building the Foundations - (CII: No later than 31 December 2027, Enterprises: No later than 31 December 2028)"
      - key: high_priority
        label: "High-priority systems migrated"
        date: 2028-12-31
        quote: "Milestone 2: Migration of High-Priority Systems – (CII: 31 December 2028, Enterprises: No later than 31 December 2030)"
      - key: full_migration
        label: "Full migration"
        date: 2029-12-31
        quote: "Milestone 3: Full Migration – (CII : 31 December 2029, Enterprises: No later than 31 December 2033)"

  - key: IN_DST_ENTERPRISE
    label: "India DST roadmap -- Enterprises"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/India_DST_Quantum_Safe_Roadmap_2026.md -- printed pp. 105-107"
    quote: "Milestone 3: Full Migration – (CII : 31 December 2029, Enterprises: No later than 31 December 2033)"
    milestones:
      - key: foundations
        label: "Building the foundations (inventory, CBOM requests)"
        # Programme-level: inventory, CBOM requests, pilots. Not something a
        # single key meets or misses, so risk/policy.py never lays it on a row.
        scope: programme
        date: 2028-12-31
        quote: "Milestone 1: Building the Foundations - (CII: No later than 31 December 2027, Enterprises: No later than 31 December 2028)"
      - key: high_priority
        label: "High-priority systems migrated"
        date: 2030-12-31
        quote: "Milestone 2: Migration of High-Priority Systems – (CII: 31 December 2028, Enterprises: No later than 31 December 2030)"
      - key: full_migration
        label: "Full migration"
        date: 2033-12-31
        quote: "Milestone 3: Full Migration – (CII : 31 December 2029, Enterprises: No later than 31 December 2033)"

  - key: NIST_IR_8547_IPD
    label: "NIST IR 8547 (initial public draft)"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/NIST_IR_8547_ipd.md -- Tables 2 and 4"
    quote: "112 bits of security strength | Deprecated after 2030; Disallowed after 2035"
    milestones:
      - key: deprecated_112
        label: "Deprecated (112-bit strength)"
        date: 2030-12-31
        quote: "112 bits of security strength | Deprecated after 2030"
        # Applies only at the 112-bit level. Strength comes from
        # data/security_strength.yaml (SP 800-57 Table 2, SP 800-186 Table 1);
        # a row whose strength is not known is "undetermined", never assumed.
        applies_at_strength: 112
      - key: disallowed
        label: "Disallowed"
        date: 2035-12-31
        quote: "≥ 128 bits of security strength | Disallowed after 2035"

  - key: EU_HIGH_RISK
    label: "EU coordinated roadmap -- high-risk use cases"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/EU_PQC_Coordinated_Roadmap_2025.md -- PDF pp. 6-7"
    quote: "For high-risk use cases, quantum-vulnerable public-key mechanisms shall not be used stand-alone after the end of 2030"
    note: >-
      Risk level is the operator's classification (the roadmap derives it from
      a quantum risk score the organisation computes, p. 10; this tool computes
      no score). Apply this policy to use cases the operator classes high-risk.
    milestones:
      - key: no_standalone_classical
        label: "No stand-alone quantum-vulnerable public key"
        date: 2030-12-31
        quote: "By 31.12.2030: ... The PQC transition for high-risk use cases has been completed."

  - key: EU_MEDIUM_RISK
    label: "EU coordinated roadmap -- medium-risk use cases"
    applies_to: quantum_vulnerable
    usable: true
    citation: "docs/sources/EU_PQC_Coordinated_Roadmap_2025.md -- PDF pp. 6-7"
    quote: "analogously after the end of 2035 for medium-risk use cases"
    milestones:
      - key: no_standalone_classical
        label: "No stand-alone quantum-vulnerable public key"
        date: 2035-12-31
        quote: "By 31.12.2035: • The PQC transition for medium-risk use cases has been completed."
