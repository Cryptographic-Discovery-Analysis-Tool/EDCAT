  - key: X25519MLKEM768
    client_key_share_bytes: 1216
    baseline_key_share_bytes: 32
    usable: true
    citation: "docs/architecture/ECDAT_Final_Architecture.md Part 8, cost model table"
    quote: "X25519MLKEM768 client key share vs X25519 | **1,216 B vs 32 B**"

  - key: ECDSA-P-256-baseline
    public_key_bytes: 64
    signature_bytes_low: 64
    signature_bytes_high: 72
    approximate: true
    usable: true
    citation: "docs/architecture/ECDAT_Final_Architecture.md Part 8, cost model table"
    quote: "ECDSA P-256 key / signature (baseline) | ~64 B / ~64–72 B"

# --- known breakage precedent ------------------------------------------------
#
# Part 8: "Migration breakage risk belongs here, not in the scanner's risk
# register." A recommendation that does not carry it is advice without a
# warning label.

breakage:
  - key: pq_key_share_handshake_failure
    measured_failure_rate: 0.0034
    applies_to: X25519MLKEM768
    usable: true
    citation: "docs/architecture/ECDAT_Final_Architecture.md Part 8"
    quote: >-
      a ~1.2 KB ClientHello crosses the single-TCP-segment / MTU boundary, and
      Cloudflare measured **~0.34% of scanned origins failing the TLS
      handshake** when sent a post-quantum key share first, because of
      ossified middleboxes and servers assuming a one-packet ClientHello.

# --- standards status --------------------------------------------------------

standards_status:
  - key: fips_203_204_205
    status: FINALISED
    date: 2024-08-13
    usable: true
    citation: "docs/architecture/ECDAT_Final_Architecture.md Part 8, 'Standards status'"
    quote: "FIPS 203 / 204 / 205 finalised **13 Aug 2024**."

  - key: fips_206_fn_dsa
    status: DRAFT
    usable: false
    citation: "docs/architecture/ECDAT_Final_Architecture.md Part 8, 'Standards status'"
    why_not_usable: >-
      FIPS 206 (FN-DSA, Falcon-based) is still draft, so it is recorded and
      never recommended. Lock §9 also lists "FIPS 206 / HQC status recheck
      before finals" as an open action.

  - key: hqc_backup_kem
    status: SELECTED_STANDARD_IN_DEVELOPMENT
    usable: false
    citation: "docs/architecture/ECDAT_Final_Architecture.md Part 8, 'Standards status'"
    why_not_usable: >-
      HQC was selected March 2025 as a code-based backup KEM but the standard
      is still in development. Recorded so its absence is deliberate.
