[project]
name = "ecdat"
version = "0.1.0"
description = "Evidence-correlation and PQC migration decision-support layer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    # CycloneDX 1.6 export is validated against the bundled schema
    # (schemas/cyclonedx-1.6.schema.json), never against a fetched one.
    # >=4.18 for the `referencing` registry API.
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]
ui = [
    "flask>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
