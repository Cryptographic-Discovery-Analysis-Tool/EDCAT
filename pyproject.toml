[project]
name = "ecdat"
version = "0.1.0"
description = "Evidence-correlation and PQC migration decision-support layer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    # CycloneDX 1.6 export is validated against the bundled schema
    # (schemas/cyclonedx-1.6.schema.json), never against a fetched one.
    # >=4.18 for the `referencing` registry API.
    "jsonschema>=4.18",
    # certs/parser.py (PEM/DER/PKCS#12 parsing) and tls/parser.py (X.509
    # subject/issuer reads) both import this directly; was missing from
    # this list even though every adapter test that exercises it passes on
    # a dev machine that happens to already have it installed some other
    # way -- caught 2026-09-20 trying a clean install in a fresh venv.
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
ui = [
    "flask>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
